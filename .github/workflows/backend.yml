name: Backend foundation
on:
  push:
    paths: ['pom.xml', 'mvnw*', '.mvn/**', 'services/**', 'infra/**', 'scripts/smoke-backend.py', '.github/workflows/backend.yml']
  pull_request:
    paths: ['pom.xml', 'mvnw*', '.mvn/**', 'services/**', 'infra/**', 'scripts/smoke-backend.py', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp verify
      - run: python3 infra/compose/init-env.py
      - run: docker compose -f infra/compose/compose.yml config --quiet
      - run: docker compose -f infra/compose/compose.yml up -d --build --wait --wait-timeout 300
      - run: python3 scripts/smoke-backend.py
      - name: Verify profile survives User restart
        run: |
          docker compose -f infra/compose/compose.yml restart user
          docker compose -f infra/compose/compose.yml up -d --wait --wait-timeout 120
          python3 scripts/smoke-backend.py --verify-persisted-profile
      - name: Stop containers without deleting persisted volumes
        if: always()
        run: |
          if [ -f infra/compose/.env ]; then
            docker compose -f infra/compose/compose.yml down
          fi
