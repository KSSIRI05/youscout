# Configuration du service ; les variables d’environnement remplacent les valeurs locales par défaut.
spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer doit correspondre au claim iss du JWT ; jwk-set-uri sert à télécharger les clés de signature.
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/youscout}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/youscout/protocol/openid-connect/certs}
          # Refuse un jeton émis pour une autre API, même si sa signature est correcte.
          audiences: youscout-api
  cloud:
    gateway:
      server:
        webflux:
          # Limite l’attente de connexion et de réponse des services pour éviter des requêtes suspendues.
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          # Transmet le Bearer original ; chaque service conserve son contrôle indépendant du JWT.
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/v1/users/**
              # Supprime les identités déclarées par le client : elles ne remplacent jamais le JWT.
              filters:
                - RemoveRequestHeader=X-User-Id
                - RemoveRequestHeader=X-User-Roles
            - id: skill-service
              uri: ${SKILL_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/v1/skills,/v1/skills/**,/v1/hashtags,/v1/hashtags/**
              filters:
                - RemoveRequestHeader=X-User-Id
                - RemoveRequestHeader=X-User-Roles
            - id: video-service
              uri: ${VIDEO_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/v1/videos/**
              filters:
                - RemoveRequestHeader=X-User-Id
                - RemoveRequestHeader=X-User-Roles
server:
  port: 8080
# N’expose que les sondes de santé, sans détails internes dans les réponses.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
