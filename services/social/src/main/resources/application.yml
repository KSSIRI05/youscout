spring:
  application:
    name: social-service
  datasource:
    url: ${SOCIAL_DB_URL:jdbc:postgresql://localhost:5437/youscout_social}
    username: ${SOCIAL_DB_USERNAME:youscout_social}
    password: ${SOCIAL_DB_PASSWORD}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/youscout}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/youscout/protocol/openid-connect/certs}
          audiences: youscout-api
server:
  port: ${SERVER_PORT:8086}
# Propriétaires des vidéos publiées et des blocages, appelés avec le jeton de l'utilisateur.
social:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  video-service-url: ${VIDEO_SERVICE_URL:http://localhost:8083}
  # Événements VideoLiked et CommentAdded (interaction.events.v1), écrits dans la transaction de l'interaction.
  outbox:
    enabled: ${SOCIAL_OUTBOX_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${INTERACTION_EVENTS_TOPIC:interaction.events.v1}
    poll-ms: 1000
management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never
  endpoint.health.probes.enabled: true
