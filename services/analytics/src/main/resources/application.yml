spring:
  application:
    name: analytics-service
  datasource:
    url: ${ANALYTICS_DB_URL:jdbc:postgresql://localhost:5441/youscout_analytics}
    username: ${ANALYTICS_DB_USERNAME:youscout_analytics}
    password: ${ANALYTICS_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/youscout}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/youscout/protocol/openid-connect/certs}
          audiences: youscout-api
server:
  port: ${SERVER_PORT:8090}
analytics:
  # Activité quotidienne (A06) : comptes créés (User), vidéos publiées (Video), likes et commentaires (Social), messages (Chat).
  ingestion:
    enabled: ${ANALYTICS_INGESTION_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    group-id: ${ANALYTICS_GROUP_ID:youscout-analytics-v1}
    topics: ${USER_RELATIONSHIPS_TOPIC:user.relationships.v1},${VIDEO_PUBLISHED_TOPIC:video.published.v2},${INTERACTION_EVENTS_TOPIC:interaction.events.v1},${CHAT_MESSAGES_TOPIC:chat.messages.v1}
management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never
  endpoint.health.probes.enabled: true
  endpoint.health.group.readiness.include: readinessState,db
