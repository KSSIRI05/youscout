spring:
  application:
    name: video-service
  mongodb:
    uri: ${VIDEO_MONGODB_URI:mongodb://localhost:27017/youscout_video?replicaSet=rs0}
  datasource:
    url: ${VIDEO_DB_URL:jdbc:postgresql://localhost:5434/youscout_video}
    username: ${VIDEO_DB_USERNAME:youscout_video}
    password: ${VIDEO_DB_PASSWORD:}
  flyway:
    enabled: ${VIDEO_FLYWAY_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/youscout}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/youscout/protocol/openid-connect/certs}
          audiences: youscout-api
server:
  port: ${SERVER_PORT:8083}
youscout:
  migration:
    postgres-to-mongo:
      enabled: ${VIDEO_POSTGRES_TO_MONGO_ENABLED:false}
  processing-results:
    enabled: ${VIDEO_PROCESSING_RESULTS_ENABLED:false}
  outbox:
    # L'enregistrement en base est toujours actif ; seul le relais est optionnel.
    enabled: ${VIDEO_OUTBOX_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    uploaded-topic: ${VIDEO_UPLOADED_TOPIC:video.uploaded.v1}
    published-topic: ${VIDEO_PUBLISHED_TOPIC:video.published.v2}
    poll-ms: 1000
    initial-delay-ms: 5000
  storage:
    s3:
      # Identifiants publics de l'infrastructure existante ; aucun secret AWS ici.
      bucket: ${VIDEO_S3_BUCKET:youscout-014663857971-dev-videos}
      region: ${VIDEO_S3_REGION:us-east-1}
      # Vide en cloud pour utiliser l'identité du workload ; profil explicite en local.
      profile: ${VIDEO_AWS_PROFILE:}
  uploads:
    max-size-bytes: ${VIDEO_MAX_UPLOAD_BYTES:104857600}
    url-lifetime-seconds: ${VIDEO_UPLOAD_URL_SECONDS:300}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      group:
        readiness:
          include: readinessState,mongo
      probes:
        enabled: true
