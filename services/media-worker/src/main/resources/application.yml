spring:
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: media-worker
  datasource:
    url: ${MEDIA_WORKER_DB_URL:jdbc:postgresql://localhost:5435/youscout_media_worker}
    username: ${MEDIA_WORKER_DB_USERNAME:youscout_media_worker}
    password: ${MEDIA_WORKER_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
  jdbc:
    template:
      query-timeout: 5s
server:
  port: ${SERVER_PORT:8084}
worker:
  processing:
    enabled: ${MEDIA_PROCESSING_ENABLED:false}
    bucket: ${VIDEO_S3_BUCKET:youscout-014663857971-dev-videos}
    region: ${VIDEO_S3_REGION:us-east-1}
    profile: ${MEDIA_WORKER_AWS_PROFILE:}
    max-bytes: 104857600
    max-duration-seconds: 180
    transcode-seconds: 120
    ffmpeg: ${FFMPEG_BIN:ffmpeg}
    ffprobe: ${FFPROBE_BIN:ffprobe}
  ingestion:
    enabled: ${MEDIA_WORKER_INGESTION_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: video.uploaded.v1
    group-id: ${MEDIA_WORKER_GROUP_ID:youscout-media-worker-v1}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
