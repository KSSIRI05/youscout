spring:
  application:
    name: media-worker
  datasource:
    url: ${MEDIA_WORKER_DB_URL:jdbc:postgresql://localhost:5435/youscout_media_worker}
    username: ${MEDIA_WORKER_DB_USERNAME:youscout_media_worker}
    password: ${MEDIA_WORKER_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
  jdbc:
    template:
      query-timeout: 5s
server:
  port: ${SERVER_PORT:8084}
worker:
  ingestion:
    enabled: ${MEDIA_WORKER_INGESTION_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: video.uploaded.v1
    group-id: ${MEDIA_WORKER_GROUP_ID:youscout-media-worker-v1}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
