# Configuration du service ; les variables d’environnement remplacent les valeurs locales par défaut.
spring:
  application:
    name: user-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer doit correspondre au claim iss du JWT ; jwk-set-uri sert à télécharger les clés de signature.
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/youscout}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/youscout/protocol/openid-connect/certs}
          # Refuse un jeton émis pour une autre API, même si sa signature est correcte.
          audiences: youscout-api
  # Connexion à la base propre au domaine ; aucun mot de passe de secours n’est codé en dur.
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5433/youscout_user}
    username: ${USER_DB_USERNAME:youscout_user}
    password: ${USER_DB_PASSWORD}
  # Applique les nouvelles migrations et vérifie les empreintes de celles déjà exécutées.
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8081}
youscout:
  # Compte de service Keycloak pour désactiver/réactiver un compte (A04) ; vide = fonctionnalité indisponible (503).
  keycloak-admin:
    base-url: ${KEYCLOAK_ADMIN_URL:}
    realm: youscout
    client-id: youscout-user-admin
    client-secret: ${USER_ADMIN_CLIENT_SECRET:}
  # U22 : services appelés pour effacer les données d'un compte fermé (route interne /internal/accounts/{subject}).
  account-closure:
    video-url: ${VIDEO_SERVICE_URL:http://localhost:8083}
    social-url: ${SOCIAL_SERVICE_URL:http://localhost:8086}
    rating-url: ${RATING_SERVICE_URL:http://localhost:8087}
    chat-url: ${CHAT_SERVICE_URL:http://localhost:8088}
    skill-url: ${SKILL_SERVICE_URL:http://localhost:8082}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8089}
    # Durée de vie des jetons d'accès Keycloak (5 min) plus une marge.
    purge-delay: ${ACCOUNT_CLOSURE_PURGE_DELAY:PT6M}
    retry-base: PT5S
    poll-ms: 2000
  user-outbox:
    enabled: ${USER_RELATIONSHIPS_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${USER_RELATIONSHIPS_TOPIC:user.relationships.v1}
    poll-ms: ${USER_OUTBOX_POLL_MS:1000}
# N’expose que les sondes de santé, sans détails internes dans les réponses.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      group:
        # Le service n’est prêt à recevoir du trafic que si sa base est également disponible.
        readiness:
          include: readinessState,db
      probes:
        enabled: true
