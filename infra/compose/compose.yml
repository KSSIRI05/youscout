# Pile locale : identité, bases, services métier et socle Video optionnel.
name: youscout-dev
services:
  # Stockage privé de Keycloak ; les comptes applicatifs n’utilisent pas cette base.
  keycloak-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run init-env.py first}
    volumes: [keycloak-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 3s
      retries: 20
  # Le domaine User possède ses propres identifiants et son volume persistant.
  user-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: youscout_user
      POSTGRES_USER: youscout_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Run init-env.py first}
    volumes: [user-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U youscout_user -d youscout_user']
      interval: 5s
      timeout: 3s
      retries: 20
  # Le catalogue et les abonnements sont isolés dans une troisième base.
  skill-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: youscout_skill
      POSTGRES_USER: youscout_skill
      POSTGRES_PASSWORD: ${SKILL_DB_PASSWORD:?Run init-env.py --upgrade first}
    volumes: [skill-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U youscout_skill -d youscout_skill']
      interval: 5s
      timeout: 3s
      retries: 20
  # start-dev et HTTP conviennent à cette pile locale ; l’import initialise un nouveau realm.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run init-env.py first}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run init-env.py first}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: 'true'
      SMOKE_CLIENT_SECRET: ${SMOKE_CLIENT_SECRET:?Run init-env.py first}
      USER_ADMIN_CLIENT_SECRET: ${USER_ADMIN_CLIENT_SECRET:?Run init-env.py --upgrade first}
    ports: ['127.0.0.1:8180:8080']
    volumes: ['../keycloak/youscout-realm.json:/opt/keycloak/data/import/youscout-realm.json:ro']
    depends_on:
      keycloak-db: {condition: service_healthy}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/localhost/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; head -1 <&3 | grep -q 200'
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
  # Aucun port hôte : la Gateway accède à User par le réseau interne Compose.
  user:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args: {MODULE: user}
    environment:
      SERVER_PORT: '8080'
      USER_DB_URL: jdbc:postgresql://user-db:5432/youscout_user
      USER_DB_USERNAME: youscout_user
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Run init-env.py first}
      OIDC_ISSUER: http://localhost:8180/realms/youscout
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/youscout/protocol/openid-connect/certs
      # Désactivation de comptes (A04) via l'API d'administration Keycloak.
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      USER_ADMIN_CLIENT_SECRET: ${USER_ADMIN_CLIENT_SECRET:?Run init-env.py --upgrade first}
      # Fermeture de compte (U22) : chaque service efface ses données ; sans les profils video et feed,
      # les étapes VIDEO et NOTIFICATION restent en attente.
      VIDEO_SERVICE_URL: http://video:8080
      SOCIAL_SERVICE_URL: http://social:8080
      RATING_SERVICE_URL: http://rating:8080
      CHAT_SERVICE_URL: http://chat:8080
      SKILL_SERVICE_URL: http://skill:8080
      NOTIFICATION_SERVICE_URL: http://notification:8080
      ACCOUNT_CLOSURE_PURGE_DELAY: ${ACCOUNT_CLOSURE_PURGE_DELAY:-PT6M}
    depends_on:
      user-db: {condition: service_healthy}
      keycloak: {condition: service_healthy}
  # Construit le même Dockerfile que User, en sélectionnant le module Maven skill.
  skill:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args: {MODULE: skill}
    environment:
      SERVER_PORT: '8080'
      SKILL_DB_URL: jdbc:postgresql://skill-db:5432/youscout_skill
      SKILL_DB_USERNAME: youscout_skill
      SKILL_DB_PASSWORD: ${SKILL_DB_PASSWORD:?Run init-env.py --upgrade first}
      OIDC_ISSUER: http://localhost:8180/realms/youscout
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/youscout/protocol/openid-connect/certs
    depends_on:
      skill-db: {condition: service_healthy}
      keycloak: {condition: service_healthy}
  # Base propriétaire du domaine Video, distincte des profils et du catalogue.
  video-db:
    profiles: [video-migration]
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: youscout_video
      POSTGRES_USER: youscout_video
      POSTGRES_PASSWORD: ${VIDEO_DB_PASSWORD:?Run init-env.py --upgrade first}
    volumes: [video-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U youscout_video -d youscout_video']
      interval: 5s
      timeout: 3s
      retries: 20
  video-mongo:
    profiles: [video]
    image: ${VIDEO_MONGODB_IMAGE:-mongo:7.0}
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes: [video-mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  video-mongo-init:
    profiles: [video]
    image: ${VIDEO_MONGODB_IMAGE:-mongo:7.0}
    depends_on:
      video-mongo: {condition: service_healthy}
    entrypoint: [mongosh, 'mongodb://video-mongo:27017/admin', --quiet, --eval]
    command: ["try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'video-mongo:27017'}]}) }"]
    restart: 'no'
  # Le fil public possède son stockage dédié, séparé des métadonnées privées de Video.
  feed-db:
    profiles: [feed]
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: youscout_feed
      POSTGRES_USER: youscout_feed
      POSTGRES_PASSWORD: ${FEED_DB_PASSWORD:?Run init-env.py --upgrade first}
    volumes: [feed-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U youscout_feed -d youscout_feed']
      interval: 5s
      timeout: 3s
      retries: 20
  feed-redis:
    profiles: [feed]
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [feed-redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  social-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: youscout_social
      POSTGRES_USER: youscout_social
      POSTGRES_PASSWORD: ${SOCIAL_DB_PASSWORD:?Run init-env.py --upgrade first}
    volumes: [social-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U youscout_social -d youscout_social']
      interval: 5s
      timeout: 3s
      retries: 20
  rating-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: youscout_rating
      POSTGRES_USER: youscout_rating
      POSTGRES_PASSWORD: ${RATING_DB_PASSWORD:?Run init-env.py --upgrade first}
    volumes: [rating-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U youscout_rating -d youscout_rating']
      interval: 5s
      timeout: 3s
      retries: 20
  # Historique de Chat : replica set mono-nœud pour les transactions séquence + message.
  chat-mongo:
    image: mongo:7.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes: [chat-mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  chat-mongo-init:
    image: mongo:7.0
    depends_on:
      chat-mongo: {condition: service_healthy}
    entrypoint: [mongosh, 'mongodb://chat-mongo:27017/admin', --quiet, --eval]
    command: ["try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'chat-mongo:27017'}]}) }"]
    restart: 'no'
  # Relais Pub/Sub entre instances Chat ; aucune donnée durable, d'où l'absence de volume.
  chat-redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  # Video identifie le joueur, persiste les métadonnées et signe les demandes PUT.
  video:
    profiles: [video]
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args: {MODULE: video}
    environment:
      SERVER_PORT: '8080'
      VIDEO_S3_BUCKET: ${VIDEO_S3_BUCKET:-youscout-014663857971-dev-videos}
      VIDEO_S3_REGION: ${VIDEO_S3_REGION:-us-east-1}
      VIDEO_DB_URL: jdbc:postgresql://video-db:5432/youscout_video
      VIDEO_DB_USERNAME: youscout_video
      VIDEO_DB_PASSWORD: ${VIDEO_DB_PASSWORD:-}
      VIDEO_MONGODB_URI: mongodb://video-mongo:27017/youscout_video?replicaSet=rs0
      VIDEO_MAX_UPLOAD_BYTES: ${VIDEO_MAX_UPLOAD_BYTES:-104857600}
      VIDEO_UPLOAD_URL_SECONDS: ${VIDEO_UPLOAD_URL_SECONDS:-300}
      VIDEO_PUBLISHED_TOPIC: video.published.v2
      VIDEO_DELETED_TOPIC: video.deleted.v1
      VIDEO_MODERATED_TOPIC: video.moderation.v1
      VIDEO_SKILL_SERVICE_URL: http://skill:8080
      OIDC_ISSUER: http://localhost:8180/realms/youscout
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/youscout/protocol/openid-connect/certs
    depends_on:
      video-mongo-init: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
      skill: {condition: service_healthy}
    # Aucun secret/profil Windows monté dans le conteneur ; identité cloud à raccorder ensuite.
  # Feed consomme les publications Kafka et construit sa propre projection des vidéos publiques.
  feed:
    profiles: [feed]
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args: {MODULE: feed}
    environment:
      SERVER_PORT: '8080'
      FEED_DB_URL: jdbc:postgresql://feed-db:5432/youscout_feed
      FEED_DB_USERNAME: youscout_feed
      FEED_DB_PASSWORD: ${FEED_DB_PASSWORD:?Run init-env.py --upgrade first}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: feed-redis
      USER_RELATIONSHIPS_TOPIC: user.relationships.v1
      OIDC_ISSUER: http://localhost:8180/realms/youscout
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/youscout/protocol/openid-connect/certs
    depends_on:
      feed-db: {condition: service_healthy}
      feed-redis: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      user: {condition: service_healthy}
  social:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args: {MODULE: social}
    environment:
      SERVER_PORT: '8080'
      SOCIAL_DB_URL: jdbc:postgresql://social-db:5432/youscout_social
      SOCIAL_DB_USERNAME: youscout_social
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:?Run init-env.py --upgrade first}
      # Les écritures vérifient les publications (profil video) et les blocages ; sans Video elles répondent 503.
      USER_SERVICE_URL: http://user:8080
      VIDEO_SERVICE_URL: http://video:8080
      OIDC_ISSUER: http://localhost:8180/realms/youscout
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/youscout/protocol/openid-connect/certs
    depends_on:
      social-db: {condition: service_healthy}
      keycloak: {condition: service_healthy}
  # Notes de compétences (U15) ; comme Social, les écritures exigent Video (profil video) et User.
  rating:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args: {MODULE: rating}
    environment:
      SERVER_PORT: '8080'
      RATING_DB_URL: jdbc:postgresql://rating-db:5432/youscout_rating
      RATING_DB_USERNAME: youscout_rating
      RATING_DB_PASSWORD: ${RATING_DB_PASSWORD:?Run init-env.py --upgrade first}
      USER_SERVICE_URL: http://user:8080
      VIDEO_SERVICE_URL: http://video:8080
      OIDC_ISSUER: http://localhost:8180/realms/youscout
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/youscout/protocol/openid-connect/certs
    depends_on:
      rating-db: {condition: service_healthy}
      keycloak: {condition: service_healthy}
  # Messagerie instantanée (U21) : WebSocket et historique ; les envois vérifient profils et blocages auprès de User.
  chat:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args: {MODULE: chat}
    environment:
      SERVER_PORT: '8080'
      CHAT_MONGODB_URI: mongodb://chat-mongo:27017/youscout_chat?replicaSet=rs0
      REDIS_HOST: chat-redis
      REDIS_PORT: '6379'
      USER_SERVICE_URL: http://user:8080
      OIDC_ISSUER: http://localhost:8180/realms/youscout
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/youscout/protocol/openid-connect/certs
    depends_on:
      chat-mongo-init: {condition: service_completed_successfully}
      chat-redis: {condition: service_healthy}
      keycloak: {condition: service_healthy}
  notification-db:
    profiles: [feed]
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: youscout_notification
      POSTGRES_USER: youscout_notification
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Run init-env.py --upgrade first}
    volumes: [notification-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U youscout_notification -d youscout_notification']
      interval: 5s
      timeout: 3s
      retries: 20
  # Notifications : consomme les événements Kafka (profil feed, comme Feed) et tient la boîte de chaque joueur.
  # Push FCM désactivé tant que FCM_PROJECT_ID et FCM_CREDENTIALS_FILE ne sont pas fournis.
  notification:
    profiles: [feed]
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args: {MODULE: notification}
    environment:
      SERVER_PORT: '8080'
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/youscout_notification
      NOTIFICATION_DB_USERNAME: youscout_notification
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Run init-env.py --upgrade first}
      NOTIFICATION_DEVICE_KEY: ${NOTIFICATION_DEVICE_KEY:?Run init-env.py --upgrade first}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OIDC_ISSUER: http://localhost:8180/realms/youscout
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/youscout/protocol/openid-connect/certs
    depends_on:
      notification-db: {condition: service_healthy}
      keycloak: {condition: service_healthy}
  analytics-db:
    profiles: [feed]
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: youscout_analytics
      POSTGRES_USER: youscout_analytics
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Run init-env.py --upgrade first}
    volumes: [analytics-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U youscout_analytics -d youscout_analytics']
      interval: 5s
      timeout: 3s
      retries: 20
  # Activité quotidienne du tableau de bord (A06), comptée depuis les événements Kafka (profil feed).
  analytics:
    profiles: [feed]
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args: {MODULE: analytics}
    environment:
      SERVER_PORT: '8080'
      ANALYTICS_DB_URL: jdbc:postgresql://analytics-db:5432/youscout_analytics
      ANALYTICS_DB_USERNAME: youscout_analytics
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Run init-env.py --upgrade first}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OIDC_ISSUER: http://localhost:8180/realms/youscout
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/youscout/protocol/openid-connect/certs
    depends_on:
      analytics-db: {condition: service_healthy}
      keycloak: {condition: service_healthy}
  # Point d’entrée des API sur localhost ; attend que les services dépendants soient sains.
  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args: {MODULE: gateway}
    environment:
      USER_SERVICE_URL: http://user:8080
      SKILL_SERVICE_URL: http://skill:8080
      VIDEO_SERVICE_URL: http://video:8080
      FEED_SERVICE_URL: http://feed:8080
      SOCIAL_SERVICE_URL: http://social:8080
      RATING_SERVICE_URL: http://rating:8080
      CHAT_SERVICE_URL: http://chat:8080
      NOTIFICATION_SERVICE_URL: http://notification:8080
      ANALYTICS_SERVICE_URL: http://analytics:8080
      OIDC_ISSUER: http://localhost:8180/realms/youscout
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/youscout/protocol/openid-connect/certs
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      user: {condition: service_healthy}
      skill: {condition: service_healthy}
      social: {condition: service_healthy}
      rating: {condition: service_healthy}
      chat: {condition: service_healthy}
      keycloak: {condition: service_healthy}
# Les volumes survivent aux redémarrages et à docker compose down sans option -v.
volumes:
  keycloak-data:
  user-data:
  skill-data:
  video-data:
  video-mongo-data:
  feed-data:
  feed-redis-data:
  social-data:
  rating-data:
  chat-mongo-data:
  notification-data:
  analytics-data:
