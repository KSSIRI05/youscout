openapi: 3.0.3
info:
  title: YouScout User API
  version: 0.5.0
  description: Persistent personal profiles and user/admin role diagnostics using verified Keycloak access tokens.
servers:
  - url: http://localhost:8080
paths:
  /v1/users/me:
    get:
      operationId: getOwnProfile
      summary: Read or provision the authenticated subject's profile
      description: |
        Creates the profile on first authenticated use. Repeated reads never overwrite
        user edits or timestamps. Initial displayName uses name, then preferred_username,
        then Joueur (trimmed and bounded to 80 Unicode code points).
        No profile identifier is accepted from the client. Requires realm role user or admin.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: patchOwnProfile
      summary: Partially update or provision the authenticated subject's profile
      description: |
        Only displayName and biography may be provided. Omitted fields stay unchanged.
        Null values, unknown fields and empty objects are rejected. An empty biography
        clears it. displayName is stripped before validation. Subject and timestamps
        are server-controlled. Concurrent changes to different fields are preserved;
        the last database update wins for the same field. No events are emitted yet.
        Requires realm role user or admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                displayName:
                  type: string
                  minLength: 1
                  description: Non-blank and at most 80 Unicode code points after stripping; no U+0000.
                  example: Yassine Amrani
                biography:
                  type: string
                  maxLength: 500
                  description: Unicode code points; no U+0000. Empty string clears the biography.
                  example: Ailier à Casablanca
      responses:
        '200':
          $ref: '#/components/responses/ProfileResponse'
        '400':
          description: Invalid JSON object, unknown field or invalid field value; no profile write
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProfileProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          description: Content-Type must be application/json
  /v1/users/{subject}:
    get:
      operationId: getPublicProfile
      summary: Read a public profile and its follower counts
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: subject
          required: true
          schema: {type: string, maxLength: 255}
      responses:
        '200':
          description: Public name, biography and follow state for the authenticated subject
          content:
            application/json:
              schema:
                type: object
                required: [subject, displayName, biography, followingCount, followerCount, following]
                properties:
                  subject: {type: string}
                  displayName: {type: string}
                  biography: {type: string}
                  followingCount: {type: integer, minimum: 0}
                  followerCount: {type: integer, minimum: 0}
                  following: {type: boolean}
        '404': {description: Profile not found}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/users/me/following:
    get:
      operationId: listFollowingSubjects
      summary: List subjects followed by the authenticated user
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Ordered list of followed profile subjects
          content:
            application/json:
              schema:
                type: array
                items: {type: string, maxLength: 255}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/users/me/feed-relations:
    get:
      operationId: getFeedRelations
      summary: Read the authenticated user's follow and block relations for feed filtering
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current relation snapshot; no-store
          content:
            application/json:
              schema:
                type: object
                required: [followingSubjects, blockedSubjects, blockedBySubjects]
                properties:
                  followingSubjects: {type: array, items: {type: string, maxLength: 255}}
                  blockedSubjects: {type: array, items: {type: string, maxLength: 255}}
                  blockedBySubjects: {type: array, items: {type: string, maxLength: 255}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/users/{subject}/follow:
    put:
      operationId: followPublicProfile
      summary: Follow a public profile
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: subject
          required: true
          schema: {type: string, maxLength: 255}
      responses:
        '200': {description: Follow state and updated follower count}
    delete:
      operationId: unfollowPublicProfile
      summary: Unfollow a public profile
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: subject
          required: true
          schema: {type: string, maxLength: 255}
      responses:
        '200': {description: Follow state and updated follower count}
  /v1/users/{subject}/block:
    put:
      operationId: blockPublicProfile
      summary: Block a public profile and remove follows in either direction
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: subject
          required: true
          schema: {type: string, maxLength: 255}
      responses:
        '200': {description: Block state}
        '400': {description: Self-block is not allowed}
        '404': {description: Target profile not found}
    delete:
      operationId: unblockPublicProfile
      summary: Unblock a profile
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: subject
          required: true
          schema: {type: string, maxLength: 255}
      responses:
        '200': {description: Block state}
  /v1/users/me/closure:
    post:
      operationId: closeMyAccount
      summary: Close the caller's account (U22)
      description: |-
        The account becomes CLOSING at once: User refuses its actions (403), hides its profile and asks Keycloak to
        disable it and end its sessions. Once access tokens issued before the request have expired (6 minutes),
        User asks Video, Social, Rating, Chat, Skill and Notification to erase the account's data, deletes the Keycloak account,
        removes follows and blocks, and keeps an anonymised CLOSED row. Failed steps are retried and logged.
        A repeated request returns the existing closure.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: {type: string, enum: [FERMER], description: Typed by the player after the consequences are shown}
      responses:
        '202':
          description: Closure recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountClosure'}
        '400': {description: Missing or wrong confirmation, or extra field}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Account deactivated by an administrator}
        '404': {description: No profile for this account}
    get:
      operationId: getMyAccountClosure
      summary: Progress of the caller's closure, while their token is still valid
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Closure log
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountClosure'}
        '404': {description: No closure for this account}
  /v1/users/admin/accounts/{subject}/closure:
    get:
      operationId: getAccountClosure
      summary: Closure log of an account, step by step (admin)
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: subject, required: true, schema: {type: string, maxLength: 255}}
      responses:
        '200':
          description: Closure log
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountClosure'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: No closure for this account}
  /v1/users/admin/session:
    get:
      operationId: getAdminSessionDiagnostic
      summary: Verify access to an admin-only diagnostic
      description: Requires realm role admin. Does not list users or change data.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verified admin identity, same representation as the session diagnostic
          content:
            application/json:
              schema:
                type: object
                required: [subject, service]
                properties:
                  subject: {type: string}
                  username: {type: string, nullable: true}
                  service: {type: string, enum: [user-service]}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/users/session:
    get:
      operationId: getVerifiedSession
      summary: Read identity from a validated access token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verified JWT identity, no profile write
          headers:
            X-Request-Id:
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [subject, service]
                properties:
                  subject: {type: string}
                  username: {type: string, nullable: true}
                  service: {type: string, enum: [user-service]}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: Upstream connection failed
        '504':
          description: Upstream response timed out
  /v1/users/admin/accounts:
    get:
      operationId: listAccounts
      summary: 'A01: every account, newest first'
      description: Admin role only (Gateway and service). `q` matches the display name (case-insensitive, SQL wildcards taken literally) or the exact subject.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: q, schema: {type: string, maxLength: 80}}
        - {in: query, name: status, schema: {type: string, enum: [ACTIVE, DEACTIVATED, CLOSING, CLOSED]}}
        - {in: query, name: before, schema: {type: string}, description: Subject of the last account already received}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: 'Accounts: subject, displayName, status, statusChangedAt, statusChangedBy, statusNote, createdAt'}
        '400': {description: Invalid filter or limit}
        '404': {description: Unknown cursor}
  /v1/users/admin/accounts/names:
    get:
      operationId: accountNames
      summary: 'A02: display names of up to 100 accounts (authors of admin content lists)'
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: subject, required: true, schema: {type: array, items: {type: string}, maxItems: 100}, style: form, explode: true}
      responses:
        '200': {description: Object mapping each known subject to its display name; unknown subjects are absent}
  /v1/users/admin/accounts/stats:
    get:
      operationId: accountTotals
      summary: 'A06: number of accounts per status'
      security: [{bearerAuth: []}]
      responses:
        '200': {description: '{"accounts": {"ACTIVE": n, "DEACTIVATED": n, "CLOSING": n, "CLOSED": n}}'}
components:
  schemas:
    UserProfile:
      type: object
      required: [subject, displayName, biography, createdAt, updatedAt]
      properties:
        subject: {type: string, readOnly: true, maxLength: 255}
        displayName: {type: string, minLength: 1, maxLength: 80}
        biography: {type: string, maxLength: 500}
        createdAt: {type: string, format: date-time, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    AccountClosure:
      type: object
      required: [subject, status, requestedAt, completedAt, steps]
      properties:
        subject: {type: string}
        status: {type: string, enum: [IN_PROGRESS, COMPLETED]}
        requestedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time, nullable: true}
        steps:
          type: array
          description: In order SESSIONS, VIDEO, SOCIAL, RATING, CHAT, SKILL, NOTIFICATION, IDENTITY
          items:
            type: object
            required: [name, status, attempts, lastError, completedAt]
            properties:
              name: {type: string, enum: [SESSIONS, VIDEO, SOCIAL, RATING, CHAT, SKILL, NOTIFICATION, IDENTITY]}
              status: {type: string, enum: [PENDING, DONE]}
              attempts: {type: integer, minimum: 0}
              lastError: {type: string, nullable: true, description: HTTP status or "Service injoignable"; no remote detail}
              completedAt: {type: string, format: date-time, nullable: true}
    ProfileProblem:
      type: object
      required: [title, status, detail]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, example: 400}
        detail: {type: string}
        instance: {type: string}
  responses:
    Unauthorized:
      description: Bearer token absent, invalid or expired (or subject invalid for profile access)
      headers:
        WWW-Authenticate:
          description: Bearer challenge for missing/invalid token
          schema: {type: string}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProfileProblem'
    Forbidden:
      description: Valid access token without the required application realm role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProfileProblem'
    ProfileResponse:
      description: Persistent profile of the verified token subject
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
        X-Request-Id:
          description: Present when accessed through the Gateway
          schema: {type: string}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfile'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
