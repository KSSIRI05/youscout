openapi: 3.0.3
info:
  title: YouScout Social API
  version: 0.2.0
  description: >-
    Likes, comments, reports, and persistent direct messages. Writes check with Video that the
    video is published and with User that no block exists between the caller and the other
    account, forwarding the caller's JWT. Errors use application/problem+json.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/social/videos/{videoId}/likes:
    parameters:
      - $ref: '#/components/parameters/videoId'
    get:
      summary: Read like count and current user's like state
      responses:
        '200':
          description: Current aggregate and caller state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LikeState'}
    put:
      summary: Like a published video (idempotent)
      responses:
        '200': {description: Updated like state}
        '403': {description: A block exists between the caller and the video owner}
        '404': {description: Video unknown or not published}
        '503': {description: Video or User unavailable}
    delete:
      summary: Remove the caller's like (always allowed)
      responses: {'200': {description: Updated like state}}
  /v1/social/videos/{videoId}/comments:
    parameters:
      - $ref: '#/components/parameters/videoId'
    get:
      summary: List the most recent visible comments
      description: >-
        Returns the newest page in chronological order. Comments by accounts blocked by, or
        blocking, the caller are omitted. Pass the id of the oldest loaded comment as `before`
        to read older comments; a page shorter than `limit` is the last one.
      parameters:
        - {in: query, name: before, required: false, schema: {type: string, format: uuid}}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Comments ordered oldest first within the page
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Comment'}}
        '400': {description: Invalid cursor or page size}
    post:
      summary: Comment, or reply to a top-level comment, as the authenticated subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 1000}
                parentId: {type: string, format: uuid, description: Top-level comment on the same video}
      responses:
        '200':
          description: Persisted comment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Comment'}
        '400': {description: Invalid body, or parent is itself a reply}
        '403': {description: A block exists with the video owner or the parent's author}
        '404': {description: Video not published, or parent comment unknown on this video}
        '503': {description: Video or User unavailable}
  /v1/social/comments/{commentId}:
    delete:
      summary: Delete a comment as its author or as the owner of the video (U13)
      parameters:
        - in: path
          name: commentId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Comment deleted}
        '404': {description: Comment unknown, already deleted, or not deletable by the caller}
  /v1/social/videos/{videoId}/reports:
    post:
      summary: Submit one report per account and published video
      parameters:
        - $ref: '#/components/parameters/videoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '202': {description: Report persisted for moderation; allowed even when a block exists}
        '404': {description: Video unknown or not published}
  /v1/social/messages:
    get:
      summary: Read the most recent messages exchanged with a single subject
      description: >-
        Returns the newest page in chronological order. `before` must be a message of this
        conversation.
      parameters:
        - in: query
          name: with
          required: true
          schema: {type: string, maxLength: 255}
        - {in: query, name: before, required: false, schema: {type: string, format: uuid}}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200': {description: Conversation messages visible to the caller}
        '400': {description: Invalid cursor or page size}
    post:
      summary: Send a persistent direct message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientSubject, body]
              properties:
                recipientSubject: {type: string, maxLength: 255}
                body: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '200': {description: Persisted message}
        '400': {description: Invalid body or message to self}
        '403': {description: A block exists between sender and recipient}
        '404': {description: Recipient profile unknown}
        '503': {description: User unavailable}
  /v1/social/comments/{commentId}/reports:
    post:
      summary: Report a visible comment (U17), once per account
      parameters:
        - {in: path, name: commentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '202': {description: Report stored (a repeated report by the same account is ignored)}
        '404': {description: Comment unknown or already removed}
  /v1/social/admin/reports:
    get:
      summary: Moderation queue grouped by target (A03); requires role admin
      parameters:
        - {in: query, name: type, schema: {type: string, enum: [VIDEO, COMMENT], default: VIDEO}}
        - {in: query, name: status, schema: {type: string, enum: [OPEN, REVIEWED, DISMISSED], default: OPEN}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000, default: 0}}
      responses:
        '200':
          description: Up to 20 targets, most recently reported first, each with its report count and 5 latest reasons
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  hasMore: {type: boolean}
                  items:
                    type: array
                    items:
                      type: object
                      required: [type, targetId, videoId, reportCount, firstReportedAt, lastReportedAt, reports]
                      properties:
                        type: {type: string, enum: [VIDEO, COMMENT]}
                        targetId: {type: string, format: uuid}
                        videoId: {type: string, format: uuid}
                        commentBody: {type: string, nullable: true}
                        commentAuthor: {type: string, nullable: true}
                        commentRemoved: {type: boolean}
                        reportCount: {type: integer, minimum: 1}
                        firstReportedAt: {type: string, format: date-time}
                        lastReportedAt: {type: string, format: date-time}
                        reports:
                          type: array
                          maxItems: 5
                          items:
                            type: object
                            properties:
                              reporterSubject: {type: string}
                              reason: {type: string}
                              createdAt: {type: string, format: date-time}
        '403': {description: Role admin required}
  /v1/social/admin/reports/{type}/{targetId}/decision:
    post:
      summary: Close every open report of a target as DISMISSED or ACTION_TAKEN (A04); audited
      parameters:
        - {in: path, name: type, required: true, schema: {type: string, enum: [VIDEO, COMMENT]}}
        - {in: path, name: targetId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [DISMISSED, ACTION_TAKEN]}
                note: {type: string, maxLength: 500}
      responses:
        '200': {description: 'Decision recorded: targetType, targetId, decision, reportsClosed'}
        '404': {description: No open report for this target}
  /v1/social/admin/comments/{commentId}/remove:
    post:
      summary: Remove a comment from every read and close its open reports (A04); idempotent and audited
      parameters:
        - {in: path, name: commentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 500}
      responses:
        '200': {description: 'Comment removed: targetType, targetId, decision COMMENT_REMOVED, reportsClosed'}
        '404': {description: Comment unknown}
components:
  parameters:
    videoId:
      in: path
      name: videoId
      required: true
      schema: {type: string, format: uuid}
  schemas:
    LikeState:
      type: object
      required: [count, liked]
      properties:
        count: {type: integer, minimum: 0}
        liked: {type: boolean}
    Comment:
      type: object
      required: [id, videoId, authorSubject, body, createdAt]
      properties:
        id: {type: string, format: uuid}
        videoId: {type: string, format: uuid}
        parentId: {type: string, format: uuid, nullable: true}
        authorSubject: {type: string}
        body: {type: string}
        createdAt: {type: string, format: date-time}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
