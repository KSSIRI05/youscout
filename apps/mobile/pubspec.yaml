name: youscout_mobile
description: Client Flutter YouScout connecté au backend, avec démonstration locale.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_appauth: ^12.1.0
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.0
  video_player: ^2.10.0
  web: ^1.1.1
dev_dependencies:
  video_player_platform_interface: ^6.9.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Light.ttf
          weight: 300
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
    - family: BigShoulders
      fonts:
        - asset: assets/fonts/BigShouldersDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BigShouldersDisplay-ExtraBold.ttf
          weight: 800
